<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sabor do Quintal</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --laranja: #c85c3b;
            --laranja-hover: #a9482e;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
        }

        /* =========================
           HERO FULLSCREEN
        ========================= */

        .hero {
            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;

            overflow: hidden;

            color: white;
        }

        /* =========================
           IMAGEM DE FUNDO
        ========================= */

        .hero-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 0;

            transform: scale(1.01);
        }

        /* =========================
           OVERLAY
        ========================= */

        .hero-overlay {
            position: absolute;

            inset: 0;

            z-index: 1;

            background:
                linear-gradient(
                    90deg,
                    rgba(25, 15, 8, 0.90) 0%,
                    rgba(25, 15, 8, 0.72) 40%,
                    rgba(25, 15, 8, 0.25) 75%,
                    rgba(25, 15, 8, 0.10) 100%
                );
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .hero-content {
            position: relative;

            z-index: 2;

            width: 100%;

            padding: 60px 8%;
        }

        .hero-text {
            max-width: 680px;
        }

        /* =========================
           MARCA
        ========================= */

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 20px;

            color: #f3c48f;

            font-size: 13px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .eyebrow::before {
            content: "";

            width: 40px;
            height: 2px;

            background: var(--laranja);
        }

        /* =========================
           TÍTULO
        ========================= */

        .hero-title {
            margin-bottom: 25px;

            font-family: 'DM Serif Display', serif;

            font-size: clamp(45px, 6vw, 78px);

            line-height: 1.05;

            color: white;
        }

        .hero-title span {
            color: #f1b879;
        }

        /* =========================
           TEXTO
        ========================= */

        .hero-description {
            max-width: 600px;

            margin-bottom: 35px;

            color: rgba(255, 255, 255, 0.88);

            font-size: 17px;
            line-height: 1.8;
        }

        /* =========================
           BOTÃO
        ========================= */

        .btn-cadastro {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 15px 30px;

            border-radius: 50px;

            background-color: var(--laranja);

            color: white;

            text-decoration: none;

            font-weight: 700;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            transition: all 0.3s ease;
        }

        .btn-cadastro:hover {
            background-color: var(--laranja-hover);

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .btn-cadastro::after {
            content: "→";

            margin-left: 12px;

            font-size: 20px;

            transition: transform 0.3s ease;
        }

        .btn-cadastro:hover::after {
            transform: translateX(5px);
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 768px) {

            .hero {
                min-height: 100svh;
            }

            .hero-image {
                object-position: center;
            }

            .hero-overlay {
                background:
                    linear-gradient(
                        180deg,
                        rgba(25, 15, 8, 0.20) 0%,
                        rgba(25, 15, 8, 0.55) 45%,
                        rgba(25, 15, 8, 0.92) 100%
                    );
            }

            .hero-content {
                padding: 40px 25px;
                display: flex;
                align-items: flex-end;
                min-height: 100svh;
            }

            .hero-title {
                font-size: 45px;
            }

            .hero-description {
                font-size: 15px;
                line-height: 1.7;
            }

            .btn-cadastro {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <main class="hero">

        <!-- IMAGEM FULLSCREEN -->
        <img
            src="imagem/img01.png"
            alt="Comida caseira do Sabor do Quintal"
            class="hero-image"
        >

        <!-- ESCURECIMENTO DA IMAGEM -->
        <div class="hero-overlay"></div>

        <!-- MENSAGEM -->
        <div class="container-fluid hero-content">

            <div class="hero-text">

                <div class="eyebrow">
                    Sabor do Quintal
                </div>

                <h1 class="hero-title">
                    O sabor de casa,
                    <span>feito com carinho.</span>
                </h1>

                <p class="hero-description">
                    Sabor de Mãe traz o aconchego da culinária
                    tradicional direto para a sua mesa. Pratos
                    fartos, temperos frescos e aquele cheirinho
                    irresistível de comida feita na hora.
                </p>

                <a
                    href="paginas/login.html"
                    class="btn-cadastro"
                >
                    Cadastrar-se
                </a>

            </div>

        </div>

    </main>

</body>

</html>
