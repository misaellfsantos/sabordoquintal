
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Acesse sua conta do Sabor do Quintal.">

    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <title>Login - Sabor do Quintal</title>
</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-12 col-md-8 col-lg-5">

            <div class="card shadow p-4">

                <div class="text-center mb-4">

                    <img th:src="@{/img/logo.png}"
                         class="rounded-circle"
                         alt="Logo Sabor do Quintal"
                         width="110"
                         height="110">

                    <h2 class="mt-3">Sabor do Quintal</h2>

                    <p>Bem-vindo ao nosso restaurante!</p>

                </div>

                <!-- FORMULÁRIO DE LOGIN -->

                <form id="formLogin">

                    <h4 class="text-center mb-3">Entrar</h4>

                    <div class="mb-3">

                        <label for="emailLogin" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               class="form-control"
                               id="emailLogin"
                               placeholder="Digite seu e-mail"
                               required>

                    </div>

                    <div class="mb-3">

                        <label for="senhaLogin" class="form-label">
                            Senha
                        </label>

                        <input type="password"
                               class="form-control"
                               id="senhaLogin"
                               placeholder="Digite sua senha"
                               required>

                    </div>

                    <div class="text-end mb-3">

                        <a href="#" id="linkRecuperar">
                            Esqueceu sua senha?
                        </a>

                    </div>

                    <button type="submit"
                            class="btn btn-entrar w-100"
                            id="btnEnviar">

                        Entrar

                    </button>

                    <button type="button"
                            class="btn btn-outline-secondary w-100 mt-3"
                            id="btnCriarConta">

                        Criar conta

                    </button>

                </form>

                <!-- FORMULÁRIO DE CADASTRO -->

                <form id="formCadastro" style="display: none;">

                    <h4 class="text-center mb-3">Criar conta</h4>

                    <div class="mb-3">

                        <label for="nomeCadastro" class="form-label">
                            Nome completo
                        </label>

                        <input type="text"
                               class="form-control"
                               id="nomeCadastro"
                               placeholder="Digite seu nome"
                               required>

                    </div>

                    <div class="mb-3">

                        <label for="emailCadastro" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               class="form-control"
                               id="emailCadastro"
                               placeholder="Digite seu e-mail"
                               required>

                    </div>

                    <div class="mb-3">

                        <label for="telefoneCadastro" class="form-label">
                            Telefone
                        </label>

                        <input type="tel"
                               class="form-control"
                               id="telefoneCadastro"
                               placeholder="(11) 99999-9999"
                               maxlength="15"
                               required>

                    </div>

                    <div class="mb-3">

                        <label for="senhaCadastro" class="form-label">
                            Senha
                        </label>

                        <input type="password"
                               class="form-control"
                               id="senhaCadastro"
                               placeholder="Crie uma senha"
                               minlength="6"
                               required>

                    </div>

                    <div class="mb-3">

                        <label for="confirmarSenha" class="form-label">
                            Confirmar senha
                        </label>

                        <input type="password"
                               class="form-control"
                               id="confirmarSenha"
                               placeholder="Confirme sua senha"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-entrar w-100"
                            id="btnCadastrar">

                        Cadastrar

                    </button>

                    <button type="button"
                            class="btn btn-outline-secondary w-100 mt-3"
                            id="btnVoltarLogin">

                        Voltar para o login

                    </button>

                </form>

                <!-- RECUPERAÇÃO DE SENHA -->

                <form id="formRecuperar" style="display: none;">

                    <h4 class="text-center mb-3">Recuperar senha</h4>

                    <p class="text-center">
                        Informe seu e-mail cadastrado.
                    </p>

                    <div class="mb-3">

                        <label for="emailRecuperar" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               class="form-control"
                               id="emailRecuperar"
                               placeholder="Digite seu e-mail"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-entrar w-100">

                        Recuperar

                    </button>

                    <button type="button"
                            class="btn btn-outline-secondary w-100 mt-3"
                            id="btnVoltarRecuperar">

                        Voltar para o login

                    </button>

                </form>

            </div>

            <footer class="text-center mt-4">

                <p>
                    © 2026 Sabor do Quintal.
                    Todos os direitos reservados.
                </p>

            </footer>

        </div>

    </div>

</div>

<script>

    // ELEMENTOS DOS FORMULÁRIOS

    const formLogin = document.getElementById("formLogin");
    const formCadastro = document.getElementById("formCadastro");
    const formRecuperar = document.getElementById("formRecuperar");

    // BOTÕES

    const btnCriarConta = document.getElementById("btnCriarConta");
    const btnVoltarLogin = document.getElementById("btnVoltarLogin");
    const btnVoltarRecuperar = document.getElementById("btnVoltarRecuperar");
    const linkRecuperar = document.getElementById("linkRecuperar");

    // MOSTRAR LOGIN

    function mostrarLogin() {

        formLogin.style.display = "block";
        formCadastro.style.display = "none";
        formRecuperar.style.display = "none";

    }

    // MOSTRAR CADASTRO

    btnCriarConta.addEventListener("click", function () {

        formLogin.style.display = "none";
        formCadastro.style.display = "block";
        formRecuperar.style.display = "none";

    });

    // VOLTAR PARA LOGIN

    btnVoltarLogin.addEventListener("click", mostrarLogin);
    btnVoltarRecuperar.addEventListener("click", mostrarLogin);

    // MOSTRAR RECUPERAÇÃO DE SENHA

    linkRecuperar.addEventListener("click", function (event) {

        event.preventDefault();

        formLogin.style.display = "none";
        formCadastro.style.display = "none";
        formRecuperar.style.display = "block";

    });

    // LOGIN - CONSULTAR BANCO DE DADOS

    formLogin.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("emailLogin")
            .value.trim().toLowerCase();

        const senha = document.getElementById("senhaLogin").value;

        const botao = document.getElementById("btnEnviar");

        botao.disabled = true;
        botao.textContent = "Entrando...";

        try {

            const resposta = await fetch("/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    senha: senha
                })

            });

            const dados = await resposta.json();

            if (!resposta.ok) {

                alert(dados.mensagem || "E-mail ou senha incorretos.");
                return;

            }

            // SALVAR DADOS BÁSICOS DO USUÁRIO

            localStorage.setItem("usuarioLogado", "true");

            localStorage.setItem("nomeUsuario", dados.nome);
            localStorage.setItem("emailUsuario", dados.email);
            localStorage.setItem("telefoneUsuario", dados.telefone || "");

            localStorage.setItem(
                "usuarioSaborQuintal",
                JSON.stringify({
                    nome: dados.nome,
                    email: dados.email,
                    telefone: dados.telefone || ""
                })
            );

            alert("Login realizado com sucesso!");

            window.location.href = "/inicio";

        } catch (erro) {

            console.error("Erro no login:", erro);

            alert("Não foi possível conectar ao servidor.");

        } finally {

            botao.disabled = false;
            botao.textContent = "Entrar";

        }

    });

    // CADASTRO - SALVAR NO MYSQL

    formCadastro.addEventListener("submit", async function (event) {

        event.preventDefault();

        const nome = document.getElementById("nomeCadastro")
            .value.trim();

        const email = document.getElementById("emailCadastro")
            .value.trim().toLowerCase();

        const telefone = document.getElementById("telefoneCadastro")
            .value.trim();

        const senha = document.getElementById("senhaCadastro").value;

        const confirmarSenha = document.getElementById("confirmarSenha")
            .value;

        const botao = document.getElementById("btnCadastrar");

        if (senha.length < 6) {

            alert("A senha deve possuir pelo menos 6 caracteres.");
            return;

        }

        if (senha !== confirmarSenha) {

            alert("As senhas não são iguais.");
            return;

        }

        botao.disabled = true;
        botao.textContent = "Cadastrando...";

        try {

            const resposta = await fetch("/api/auth/cadastro", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: nome,
                    email: email,
                    telefone: telefone,
                    senha: senha

                })

            });

            const dados = await resposta.json();

            if (!resposta.ok) {

                alert(dados.mensagem || "Não foi possível realizar o cadastro.");
                return;

            }

            alert(dados.mensagem);

            // LIMPAR FORMULÁRIO E VOLTAR PARA LOGIN

            formCadastro.reset();

            document.getElementById("emailLogin").value = email;

            mostrarLogin();

        } catch (erro) {

            console.error("Erro no cadastro:", erro);

            alert("Não foi possível conectar ao servidor.");

        } finally {

            botao.disabled = false;
            botao.textContent = "Cadastrar";

        }

    });

    // RECUPERAÇÃO DE SENHA

    formRecuperar.addEventListener("submit", function (event) {

        event.preventDefault();

        alert(
            "A recuperação de senha ainda não está configurada no servidor. Entre em contato com o restaurante."
        );

    });

    // MÁSCARA DE TELEFONE

    const telefoneCadastro = document.getElementById("telefoneCadastro");

    telefoneCadastro.addEventListener("input", function () {

        let telefone = telefoneCadastro.value.replace(/\D/g, "");

        telefone = telefone.substring(0, 11);

        if (telefone.length > 10) {

            telefone = telefone.replace(
                /^(\d{2})(\d{5})(\d{4})$/,
                "($1) $2-$3"
            );

        } else if (telefone.length > 6) {

            telefone = telefone.replace(
                /^(\d{2})(\d{4})(\d{0,4})$/,
                "($1) $2-$3"
            );

        } else if (telefone.length > 2) {

            telefone = telefone.replace(
                /^(\d{2})(\d{0,5})$/,
                "($1) $2"
            );

        }

        telefoneCadastro.value = telefone;

    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
