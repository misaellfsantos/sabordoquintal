<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Página oficial do Sabor do Quintal, restaurante rural com comida caseira e saborosa.">

    <meta name="keywords"
        content="Sabor do Quintal, restaurante rural, restaurante, comida caseira, localização">

    <meta name="author" content="Luara Pires">

    <link rel="icon" type="image/png" href="../faviconn.png">

    <title>Sabor do Quintal - Localização</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
        rel="stylesheet">



</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <!-- LOGO CLICÁVEL -->

        <a
            href="pagina_principal.html"
            class="logo-link"
            title="Voltar para a página principal"
        >

            <img
                src="../imagem/logo.png"
                alt="Logo Sabor do Quintal"
                class="logo"
            >

        </a>


        <h1 class="titulo">
            Sabor do Quintal
        </h1>


        <a
            href="pagina_principal.html"
            class="home"
        >

            <i class="bi bi-house-door"></i>

            <span>Home</span>

        </a>

    </header>



    <!-- ================= MAIN ================= -->

    <main>

        <div class="container-principal">


            <!-- ================= COLUNA ESQUERDA ================= -->

            <section>


                <div class="formulario">

                    <h2 class="titulo-formulario">

                        <i class="bi bi-geo-alt"></i>

                        Encontre nosso restaurante

                    </h2>


                    <!-- ESTADO -->

                    <div class="campo">

                        <label for="estado">
                            Estado:
                        </label>

                        <input
                            type="text"
                            id="estado"
                            value="São Paulo"
                            placeholder="Ex: São Paulo"
                        >

                    </div>


                    <!-- CIDADE -->

                    <div class="campo">

                        <label for="cidade">
                            Cidade:
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            value="São Roque"
                            placeholder="Ex: São Roque"
                        >

                    </div>


                    <!-- BAIRRO -->

                    <div class="campo">

                        <label for="bairro">
                            Bairro:
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            value="Canguera"
                            placeholder="Ex: Canguera"
                        >

                    </div>


                    <!-- RUA -->

                    <div class="campo">

                        <label for="rua">
                            Rua / número:
                        </label>

                        <input
                            type="text"
                            id="rua"
                            value="Estrada do Vinho, 2450"
                            placeholder="Ex: Estrada do Vinho, 2450"
                        >

                    </div>


                    <div id="mensagem"></div>


                    <!-- BOTÃO -->

                    <button
                        type="button"
                        class="btn-continuar"
                        onclick="mostrarMapa()"
                    >

                        <i class="bi bi-map"></i>

                        Encontrar no mapa

                    </button>

                </div>



                <!-- CONTATO -->

                <div class="contato">

                    <p>

                        Caso tenha alguma dúvida,
                        entre em contato conosco.

                    </p>


                    <p class="telefone">

                        <i class="bi bi-telephone"></i>

                        (11) 9 3275-8484

                    </p>

                </div>

            </section>



            <!-- ================= COLUNA DIREITA ================= -->

            <section>


                <!-- MAPA -->

                <div class="mapa">

                    <iframe
                        id="mapaGoogle"
                        src="https://www.google.com/maps?q=Estrada%20do%20Vinho%2C%202450%2C%20Canguera%2C%20São%20Roque%2C%20São%20Paulo%2C%2018145-000&output=embed"
                        loading="lazy"
                        allowfullscreen>
                    </iframe>

                </div>



                <!-- DESCRIÇÃO -->

                <div class="descricao">

                    <p>

                        <i class="bi bi-geo-alt-fill"></i>

                        <strong>Sabor do Quintal – Restaurante Rural</strong><br>

                        Estrada do Vinho, 2450 – Canguera<br>

                        São Roque – SP | CEP 18145-000

                    </p>

                </div>



                <!-- FOTO -->

                <div class="foto-restaurante">

                    <img
                        src="../imagem/entrada_restaurante.png"
                        alt="Entrada do restaurante Sabor do Quintal"
                    >

                </div>

            </section>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div>

            <i class="bi bi-telephone"></i>

            (11) 9 3275-8484

        </div>


        <div class="direitos">

            © Direitos autorais

        </div>


        <div class="email">

            sabordoquintal@gmail.com

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function mostrarMapa() {

            // Pega os valores digitados

            const estado =
                document.getElementById("estado").value.trim();

            const cidade =
                document.getElementById("cidade").value.trim();

            const bairro =
                document.getElementById("bairro").value.trim();

            const rua =
                document.getElementById("rua").value.trim();


            const mensagem =
                document.getElementById("mensagem");


            // Verifica os campos

            if (
                estado === "" ||
                cidade === "" ||
                bairro === ""
            ) {

                mensagem.style.display = "block";

                mensagem.style.color = "#a00000";

                mensagem.innerHTML =
                    "Preencha Estado, Cidade e Bairro.";

                return;

            }


            /*
                Monta o endereço.

                Aqui NÃO colocamos o nome do restaurante,
                pois queremos que o Google Maps procure
                diretamente pelo endereço.
            */

            let endereco = "";


            if (rua !== "") {

                endereco += rua + ", ";

            }


            endereco +=
                bairro + ", " +
                cidade + ", " +
                estado;


            /*
                Transforma o endereço em formato
                adequado para a URL.
            */

            const enderecoMapa =
                encodeURIComponent(endereco);


            /*
                Atualiza o mapa que aparece
                dentro da página.
            */

            const mapa =
                document.getElementById("mapaGoogle");


            mapa.src =
                "https://www.google.com/maps?q=" +
                enderecoMapa +
                "&output=embed";


            /*
                Mostra confirmação.
            */

            mensagem.style.display = "block";

            mensagem.style.color = "#155724";

            mensagem.innerHTML =
                "Localização atualizada no mapa!";


            /*
                Leva o usuário até o mapa.
            */

            document.querySelector(".mapa").scrollIntoView({

                behavior: "smooth",

                block: "center"

            });

        }


        /*
            Permite usar a tecla ENTER
            para pesquisar.
        */

        document.querySelectorAll(".campo input").forEach(function(input) {

            input.addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    mostrarMapa();

                }

            });

        });

    </script>


</body>

</html>
