
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Clientes | Sabor do Quintal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --laranja: #c85c3b;
            --laranja-hover: #a9482e;
            --bege: #f5e9cd;
            --fundo: #f4f0e8;
            --marrom: #2d241e;
            --marrom-claro: #6b5748;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--marrom);
            font-family: Arial, sans-serif;
        }

        .admin-header {
            background: var(--marrom);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .admin-header a {
            color: white;
            text-decoration: none;
        }

        .container-admin {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .titulo-pagina {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .descricao {
            color: var(--marrom-claro);
            margin-bottom: 25px;
        }

        .resumo-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .resumo-card i {
            font-size: 30px;
            color: var(--laranja);
        }

        .resumo-card h3 {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0 0;
        }

        .resumo-card p {
            margin: 5px 0 0;
            color: var(--marrom-claro);
        }

        .tabela-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        .topo-tabela {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .topo-tabela h4 {
            font-weight: bold;
            margin: 0;
        }

        .campo-pesquisa {
            max-width: 320px;
        }

        .table thead th {
            background: var(--bege);
            color: var(--marrom);
            padding: 15px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .btn-excluir {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 13px;
            cursor: pointer;
        }

        .btn-excluir:hover {
            background: #b02a37;
            color: white;
        }

        .btn-voltar {
            display: inline-block;
            background: var(--laranja);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn-voltar:hover {
            background: var(--laranja-hover);
            color: white;
        }

        .vazio {
            text-align: center;
            padding: 35px;
            color: var(--marrom-claro);
        }

        .vazio i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container-admin {
                width: 94%;
            }

            .titulo-pagina {
                font-size: 24px;
            }

            .tabela-container {
                padding: 15px;
            }

            .campo-pesquisa {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">
    <h2><i class="bi bi-shop"></i> Sabor do Quintal</h2>

    <a th:href="@{/admin}">
        <i class="bi bi-arrow-left"></i> Voltar ao painel
    </a>
</header>

<main class="container-admin">

    <a th:href="@{/admin}" class="btn-voltar">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>

    <h1 class="titulo-pagina">
        <i class="bi bi-people"></i> Gerenciar Clientes
    </h1>

    <p class="descricao">
        Consulte e gerencie os clientes cadastrados no Sabor do Quintal.
    </p>

    <!-- RESUMO -->
    <div class="row">

        <div class="col-md-4">
            <div class="resumo-card">
                <i class="bi bi-people-fill"></i>

                <h3 th:text="${#lists.size(clientes)}">0</h3>

                <p>Total de clientes cadastrados</p>
            </div>
        </div>

    </div>

    <!-- TABELA -->
    <section class="tabela-container">

        <div class="topo-tabela">

            <h4>
                <i class="bi bi-person-lines-fill"></i>
                Lista de clientes
            </h4>

            <input
                    type="text"
                    id="pesquisa"
                    class="form-control campo-pesquisa"
                    placeholder="Pesquisar cliente..."
                    onkeyup="pesquisarClientes()">

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody id="tabelaClientes">

                <tr th:each="cliente : ${clientes}">

                    <td th:text="${cliente.id}"></td>

                    <td th:text="${cliente.nome}"></td>

                    <td th:text="${cliente.email}"></td>

                    <td th:text="${cliente.telefone != null and !#strings.isEmpty(cliente.telefone) ? cliente.telefone : 'Não informado'}"></td>

                    <td>
                        <form
                                th:action="@{/admin/clientes/excluir/{id}(id=${cliente.id})}"
                                method="post"
                                onsubmit="return confirm('Tem certeza que deseja excluir este cliente?');">

                            <button type="submit" class="btn-excluir">
                                <i class="bi bi-trash"></i>
                                Excluir
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="5" class="vazio">
                        <i class="bi bi-person-x"></i>
                        Nenhum cliente cadastrado.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script>
    function pesquisarClientes() {

        const pesquisa = document
            .getElementById("pesquisa")
            .value
            .toLowerCase();

        const linhas = document.querySelectorAll(
            "#tabelaClientes tr"
        );

        linhas.forEach(function(linha) {

            const texto = linha.innerText.toLowerCase();

            linha.style.display = texto.includes(pesquisa)
                ? ""
                : "none";

        });
    }
</script>

</body>
</html>
